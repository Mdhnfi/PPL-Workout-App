services:
  postgres-dev:
    image: postgres:17
    container_name: schema_vcs_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: dba_admin
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./docker/init/dev.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dba_admin -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-staging:
    image: postgres:17
    container_name: schema_vcs_staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: dba_admin
      POSTGRES_PASSWORD: staging_password_123
      POSTGRES_DB: app_db
    ports:
      - "5434:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
      - ./docker/init/staging.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dba_admin -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-prod:
    image: postgres:17
    container_name: schema_vcs_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: dba_admin
      POSTGRES_PASSWORD: prod_password_123
      POSTGRES_DB: app_db
    ports:
      - "5435:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./docker/init/prod.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dba_admin -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
  pgdata_staging:
  pgdata_prod:
